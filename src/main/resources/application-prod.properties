# Produção: atrás de um reverse proxy com TLS.
server.servlet.session.cookie.secure=true
# Confia nos headers X-Forwarded-* do proxy para obter o IP real (usado pelo rate limit).
# Só é seguro porque a aplicação não fica exposta diretamente na internet.
server.forward-headers-strategy=native

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}

spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Fixo, sem variável de ambiente: em produção não existe simulação de pagamento.
taskbridge.pagamento.debug-habilitado=false
taskbridge.dados-demonstracao=false

logging.level.root=INFO
logging.level.com.taskbridge=INFO
