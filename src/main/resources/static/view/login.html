<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · TaskBridge</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/taskbridge.css">
    <script src="/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js" defer></script>
    <script src="/webjars/lucide/1.20.0/dist/umd/lucide.min.js" defer></script>
    <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
<a class="tb-skip visually-hidden-focusable" href="#conteudo">Pular para o conteúdo</a>
<header id="tb-cabecalho"></header>
<main id="conteudo" class="tb-main" tabindex="-1">
    <div class="container-lg">
        <div class="tb-caixa-auth">
            <section class="tb-painel">
                <div class="tb-painel-titulo"><h1 class="h2">Entrar no TaskBridge</h1></div>
                <form class="tb-painel-corpo" id="form-login" novalidate>
                    <div class="alert alert-danger" data-erro-formulario tabindex="-1" hidden></div>
                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" id="email" name="email" type="email" autocomplete="username" required maxlength="160">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="senha">Senha</label>
                        <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" required maxlength="128">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Entrar</button>
                </form>
                <div class="tb-painel-corpo pt-0" id="login-social" hidden></div>
                <div class="tb-painel-rodape">Ainda não tem conta? <a href="/register">Criar conta</a></div>
            </section>
            <p class="small text-secondary">Por segurança, após várias tentativas sem sucesso o acesso fica bloqueado por alguns minutos.</p>
        </div>
    </div>
</main>
<footer id="tb-rodape"></footer>
</body>
</html>
