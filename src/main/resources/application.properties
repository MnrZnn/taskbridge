spring.application.name=taskbridge
spring.profiles.default=dev
# Em desenvolvimento, lê variáveis do arquivo .env (se existir). Em produção, use variáveis de ambiente reais.
spring.config.import=optional:file:.env[.properties]

# ---------- Banco ----------
# DB_URL permite informar a URL JDBC inteira (ex.: Cloud SQL); sem ela, a URL é montada com DB_HOST/DB_PORT/DB_NAME.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskbridge}?sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:taskbridge}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.jakarta.persistence.query.timeout=5000
# Carrega coleções/associações LAZY em lotes (evita N+1 ao listar projetos com habilidades e requisitos).
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.transaction.default-timeout=10s

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- HTTP ----------
# Rejeita campos desconhecidos no JSON: enviar "id", "status" ou "clienteId" gera 400 (mass assignment).
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=3MB
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:TBSESSION}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------- OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**

# ---------- TaskBridge ----------
taskbridge.seguranca.bcrypt-forca=12
taskbridge.seguranca.max-tentativas-login=5
taskbridge.seguranca.duracao-bloqueio-login=15m
taskbridge.seguranca.max-corpo-json=64KB
taskbridge.seguranca.cors-origens=${CORS_ALLOWED_ORIGINS:}

taskbridge.rate-limit.login.capacidade=5
taskbridge.rate-limit.login.periodo=1m
taskbridge.rate-limit.registro.capacidade=3
taskbridge.rate-limit.registro.periodo=10m
taskbridge.rate-limit.upload.capacidade=10
taskbridge.rate-limit.upload.periodo=1h
taskbridge.rate-limit.api.capacidade=120
taskbridge.rate-limit.api.periodo=1m

taskbridge.pagamento.modo=${PAYMENT_MODE:MOCK}
taskbridge.pagamento.debug-habilitado=${PAYMENT_DEBUG_ENABLED:false}
taskbridge.pagamento.validade-cobranca=30m

taskbridge.armazenamento.diretorio=${STORAGE_DIR:./data/uploads}

taskbridge.matching.peso-categoria=30
taskbridge.matching.peso-habilidades=25
taskbridge.matching.peso-orcamento=20
taskbridge.matching.peso-prazo=15
taskbridge.matching.peso-disponibilidade=10
taskbridge.matching.limite-candidatos=200

# Login com Google/GitHub: cada provedor só é ativado se as duas variáveis estiverem preenchidas.
taskbridge.login-social.google.client-id=${GOOGLE_CLIENT_ID:}
taskbridge.login-social.google.client-secret=${GOOGLE_CLIENT_SECRET:}
taskbridge.login-social.github.client-id=${GITHUB_CLIENT_ID:}
taskbridge.login-social.github.client-secret=${GITHUB_CLIENT_SECRET:}
taskbridge.login-social.url-base=${APP_BASE_URL:}

taskbridge.privacidade.versao-termos=2026-09
taskbridge.privacidade.retencao-auditoria=180d
