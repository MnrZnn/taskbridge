# Para rodar com MariaDB (ex.: o "MySQL" do XAMPP) em vez de MySQL 8.
# Use junto com dev:  SPRING_PROFILES_ACTIVE=dev,mariadb
#
# Com o driver MySQL, o MariaDB se apresenta como "MySQL" e o Hibernate escolheria o dialeto do MySQL 8,
# que gera "SELECT ... FOR UPDATE OF" (sintaxe que o MariaDB não aceita — quebra o aceite de propostas).
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
