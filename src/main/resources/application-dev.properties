# Desenvolvimento local: MySQL do docker-compose, PIX mock com ações de debug e dados de demonstração.
spring.datasource.password=${DB_PASSWORD:taskbridge-dev}

taskbridge.pagamento.modo=MOCK
taskbridge.pagamento.debug-habilitado=${PAYMENT_DEBUG_ENABLED:true}
taskbridge.dados-demonstracao=true

# Só necessário se o front-end for servido por outro servidor (ex.: Live Server na porta 5500).
taskbridge.seguranca.cors-origens=${CORS_ALLOWED_ORIGINS:http://localhost:5500}

logging.level.com.taskbridge=DEBUG
