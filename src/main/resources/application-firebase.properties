# Publicação na nuvem: Firebase Hosting (domínio + HTTPS) → Cloud Run (esta aplicação) → Cloud SQL (MySQL).
# Ative com SPRING_PROFILES_ACTIVE=firebase. Passo a passo em docs/FIREBASE.md.

# O Firebase Hosting descarta todos os cookies das requisições, exceto um chamado "__session".
server.servlet.session.cookie.name=__session
server.servlet.session.cookie.secure=true

# Atrás do Firebase + Google Front End, o IP do usuário chega em X-Forwarded-For. Sem confiar nesse
# header, todos os usuários pareceriam ter o mesmo IP (o do proxy) e o rate limit por IP bloquearia todo
# mundo junto. Trade-off: o primeiro valor do header pode ser forjado pelo cliente, então o limite por IP
# vira "melhor esforço"; o bloqueio de conta após 5 falhas continua valendo. Em produção real, somar
# Cloud Armor/App Check.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*

spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Não há integração bancária neste projeto: o PIX é sempre simulado. Numa demonstração pública, o botão
# "Simular pagamento" é a única forma de completar o fluxo (só o próprio pagador consegue usá-lo).
taskbridge.pagamento.modo=MOCK
taskbridge.pagamento.debug-habilitado=${PAYMENT_DEBUG_ENABLED:true}

# Contas de exemplo (senha pública no README): desligadas, a não ser que DEMO_DATA=true.
taskbridge.dados-demonstracao=${DEMO_DATA:false}

logging.level.root=INFO
logging.level.com.taskbridge=INFO
