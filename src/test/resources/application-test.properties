# Testes rodam sem infraestrutura: H2 em modo de compatibilidade MySQL, com as MESMAS migrations do Flyway.
# O banco oficial continua sendo MySQL; o H2 só existe no escopo de teste.
spring.datasource.url=jdbc:h2:mem:taskbridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# BCrypt com custo baixo só para os testes ficarem rápidos.
taskbridge.seguranca.bcrypt-forca=4
taskbridge.rate-limit.api.capacidade=10000
taskbridge.rate-limit.registro.capacidade=1000
taskbridge.rate-limit.upload.capacidade=1000

taskbridge.pagamento.modo=MOCK
taskbridge.pagamento.debug-habilitado=true
taskbridge.dados-demonstracao=false
taskbridge.armazenamento.diretorio=target/test-uploads

logging.level.com.taskbridge=INFO
logging.level.taskbridge.auditoria=WARN
