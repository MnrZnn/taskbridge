# Produção em uma única VM (ex.: servidor pequeno de nuvem).
# Copie este arquivo e o Caddyfile para /opt/taskbridge no servidor, crie o .env (ver .env.example)
# e rode: docker compose -f docker-compose.prod.yml up -d
#
#   Internet ──443──▶ caddy (TLS automático) ──rede interna──▶ app:8080 ──▶ mysql:3306
#
# Só o Caddy publica portas. App e banco ficam na rede interna do Docker, sem acesso externo.
# Com MySQL gerenciado (RDS, Cloud SQL, Azure Database), remova o serviço mysql e aponte DB_HOST para ele.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    depends_on:
      - app

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:?defina GITHUB_REPOSITORY no .env}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-mysql}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # A imagem JRE não tem curl; o bash consegue abrir a conexão TCP sozinho.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      retries: 30

volumes:
  caddy-data:
  caddy-config:
  uploads:
  mysql-data:
